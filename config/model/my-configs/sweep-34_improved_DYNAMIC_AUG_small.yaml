# Best one_cycle and so far overall config
# https://wandb.ai/qqwy/ag_classifier_main/runs/qwhouv06/workspace?nw=nwuserpauliusp7
# val_total_loss:      0.749
# val_age_mae:         5.471
# best_val_gender_acc: 0.921
# train_gender_acc:    0.981

prefix: "NO_WEIGHTS_full_dynamic_aug_tune_18_cycle+3"


use_dynamic_augmentation: True
dynamic_augmentation_mult: 0.3

num_aug_bins: 9

# Model configuration
model_type: "mobilenet_v3_small"
pretrained: True

#ds_path: "dataset/folds/fold_0"
#val_path: "dataset/prod_folds_8_9_test"
#train_path: "dataset/prod_folds_8_first_train"
#ds_path: "dataset/fold_0_1_2_4_8"
#ds_path: "dataset/full"
# val_path: "dataset/test_2_folds_last"
# train_path: "dataset/train_8_folds_first"
ds_path: "/content/data/UTKFace/UTKFace"

num_epochs: 19
#num_epochs: 10
batch_size: 256
freeze_epochs: 0
gender_loss_weight: 0.9

# Optimizer params
base_lr: 0.0068893981577029285
weight_decay: 0.00019323262043373016

# Regularization params
dropout: 0.1
l1_lambda: 0.0001

# Scheduler specific params
lr_scheduler: "one_cycle"
max_lr: 0.012321315111072404
anneal_strategy: "cos"
pct_start: 0.36685557351085574
div_factor: 24
final_div_factor: 2873

#override_cycle_epoch_count: 5
#override_cycle_epoch_count: 17
override_cycle_epoch_count: 17


# Transform params
#include_center_crop: True
#include_color_jitter: True
#include_gaussian_blur: True
#include_gaussian_noise: False
#include_random_affine: False
#include_random_erasing: False
#include_random_grayscale: True
#include_random_horizontal_flip: False
#include_random_perspective: True
#include_random_rotation: True

# Augmentations tuned for store-entrance camera mounted slightly high (top-down angle).
# YOLO mostly selects clear, frontal crops — but may occasionally pass a slightly blurry
# (person moving fast) or slightly tilted frame. We keep a minimal safety net for that.
include_center_crop: false          # YOLO already crops the face tightly
include_color_jitter: true          # Entrance lighting varies (time of day, artificial light)
include_gaussian_blur: true         # Safety net: YOLO may occasionally pick a slightly motion-blurred frame
include_gaussian_noise: false       # Noise is unlikely even with YOLO imperfections
include_random_affine: false        # Too aggressive; camera angle is fixed
include_random_erasing: false       # Heavy occlusion unlikely even with YOLO mistakes
include_random_grayscale: true      # Prevents skin-color bias in gender prediction
include_random_horizontal_flip: true  # Faces are symmetric; valid augmentation
include_random_perspective: true    # Camera is elevated — top-down angle creates real perspective distortion on faces
include_random_rotation: true       # Safety net: slight head tilts or off-angle YOLO crops
